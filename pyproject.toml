[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "komfovent-mqtt"
version = "0.1.0"
description = "Publish Komfovent ventilation unit (C6/C6M) readings to MQTT over Modbus TCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0,<3",
    "pymodbus>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
komfovent-mqtt = "komfovent_mqtt.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
